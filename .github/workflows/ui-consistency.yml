name: Native UI consistency

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'shell/qml/**'
      - 'marathon-silica/**'
      - 'tools/native-ui-consistency/**'
      - 'docs/v2/NATIVE_UI_CONSISTENCY.md'
      - 'docs/v2/WEB_DESIGNER_PRO_NATIVE_BRIEF.md'
      - '.github/workflows/ui-consistency.yml'
      - 'tests/CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ui-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check shared native style rules and all-app inventory
        run: |
          cmake -S tools/native-ui-consistency -B build-ui-consistency
          ctest --test-dir build-ui-consistency --output-on-failure --no-tests=error
          python3 tests/lint/check-test-reachability.py
          git diff --check
