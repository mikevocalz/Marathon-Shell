name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Configures with -DBUILD_TESTING=ON, builds, runs ctest under
# QT_QPA_PLATFORM=offscreen (Rust_Crates runs `cargo test` for crates/), then
# cargo clippy -D warnings for crates/. All of it is scripts/ci/build-and-test.sh
# inside alpine:edge on an arm64 runner: the same base and arch the
# marathon-shell apk is built on (release.yml), with Qt 6.11.
#
# The separate native-ui job builds the pinned real Keel plugins and requires
# complete Notes/Tasks, Settings AppPages and shell PageViewHub coverage. Broader
# suites, compositor server operation, and device mlite/dconf remain outside
# that focused gate. Alpine also has no busctl,
# so Shell_KeelActivation is not registered in the shell build job.

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Exercise real systemd-tmpfiles on the Ubuntu host; Alpine lacks it.
      - name: Test migrated home preservation
        run: python3 scripts/qemu/test_userconfig_seed.py

      - name: Build and test in alpine:edge
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" docker.io/library/alpine:edge \
            /src/scripts/ci/build-and-test.sh

  native-ui:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Require native app and launcher UI with validator contracts
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" docker.io/library/alpine:edge \
            /src/scripts/ci/native-ui.sh

  # Release notes are generated from commit subjects (cliff.toml), so every
  # commit a pull request adds must be a Conventional Commit of a known type.
  # Locally: git cliff origin/main..HEAD
  commit-subjects:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check commit subjects with git-cliff
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src -e RANGE docker.io/library/alpine:edge \
            sh -c 'set -eu
              apk add --no-cache -q git git-cliff
              git config --global --add safe.directory /src
              git cliff "$RANGE"'
